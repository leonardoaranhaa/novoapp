name: APK Android de teste

on:
  push:
    branches: [main, "cursor/**"]
    paths:
      - "src/**"
      - "mobile/**"
      - "android/**"
      - "public/**"
      - "capacitor.config.ts"
      - "vite.mobile.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci

      - name: Build debug APK
        run: npm run android:apk

      - uses: actions/upload-artifact@v4
        with:
          name: latente-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Rolling pre-release so the newest test build always has the same phone-friendly link.
      - name: Publish rolling pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk latente-teste.apk
          gh release delete apk-teste --yes --cleanup-tag || true
          gh release create apk-teste latente-teste.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latente — APK de teste" \
            --notes "Build de teste (debug) do commit ${GITHUB_SHA::7} em ${GITHUB_REF_NAME}. Não é a versão da loja."
